<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Civ Italia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen strategy map. Header (title, election, lenses, legend) on top; canvas fills the rest;
   detail sheet docks at the bottom on phones and on the right on wide screens. Explorer and Help open as overlays. */
:root{
  --sea:#dde7ee; --panel:#ffffff; --panel2:#f3f6f8; --ink:#14212b; --muted:#566772; --line:#c6d2da; --accent:#9a6a12; --nodata:#bcc7ce;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sea:#0f1a22; --panel:#17242e; --panel2:#1d2c37; --ink:#e8eef2; --muted:#9aaab5; --line:#2c3d49; --accent:#e0b458; --nodata:#2a3842; color-scheme:dark; } }
:root[data-theme="dark"]{
  --sea:#0f1a22; --panel:#17242e; --panel2:#1d2c37; --ink:#e8eef2; --muted:#9aaab5; --line:#2c3d49; --accent:#e0b458; --nodata:#2a3842; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--sea);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:22px;line-height:1;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.top .sp{flex:1}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:500 13px var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
.btn:hover{background:var(--panel2)}
select{font:500 13px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;max-width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.lenses{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;min-width:0}
.lenses::-webkit-scrollbar{display:none}
.lenses .grp{flex:none;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;align-self:center;padding:0 2px 0 6px}
.lenses button{flex:none;font:500 13px var(--body);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.lenses button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.lenses button[disabled]{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible,summary:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);min-height:26px}
.ramp{flex:1 1 180px;max-width:340px}
.ramp i{display:block;height:10px;border-radius:3px}
.ramp div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;margin-top:2px;gap:6px}
.sw{display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.sw b{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
main{position:relative;flex:1 1 0;min-height:220px}
canvas#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 18px var(--body);cursor:pointer}
.hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 7px;opacity:.92}
#sheet{background:var(--panel);border-top:1px solid var(--line);padding-block:10px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex:0 1 auto;max-height:44%;overflow-y:auto}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:2px 8px;flex-wrap:wrap}
.sh h2{font-family:var(--display);font-size:19px;margin:0;text-wrap:balance}
.sh small{color:var(--muted);font-size:12px;white-space:nowrap}
h3{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 6px}
.yields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.yields div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.yields span{display:block;font-size:11px;color:var(--muted)}
.yields strong{font:600 16px var(--body);font-variant-numeric:tabular-nums;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yields .g{display:inline-block;width:1.2em;text-align:center;font-family:var(--mono);color:var(--accent)}
.bars{display:grid;grid-template-columns:minmax(0,auto) 1fr auto;gap:4px 8px;align-items:center;font-size:13px}
.bars>span:first-child,.bars .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .bar{height:8px;border-radius:0 4px 4px 0;min-width:1px;display:block}
.bars .v{font-variant-numeric:tabular-nums;text-align:right}
.note{color:var(--muted);font-size:12px;margin:8px 0 0}
.flag{border-left:3px solid var(--accent);padding:4px 8px;background:var(--panel2);font-size:12.5px;margin:8px 0;border-radius:0 6px 6px 0}
details{font-size:13px;color:var(--muted);margin-top:8px} details p{margin:6px 0}
summary{cursor:pointer;color:var(--ink);font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:600;color:var(--muted);font-size:11.5px;text-align:left;border-bottom:1px solid var(--line);padding:4px 6px;position:sticky;top:0;background:var(--panel);cursor:pointer;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--line);padding:3px 6px;white-space:nowrap}
#ctab td:first-child{white-space:normal}
#ctab{table-layout:auto}
.tbl td.n,.tbl th.n{text-align:right}
.tbl tr:hover td{background:var(--panel2)}
.linkish{all:unset;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.linkish:hover{text-decoration-color:var(--ink)}
.tscroll{overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;background:var(--panel2)}
.cit{display:flex;flex-wrap:wrap;gap:2px;margin:4px 0}
.cit i{width:9px;height:9px;border-radius:2px;display:block}
.adv p{margin:6px 0;color:var(--ink);font-size:13.5px}
.adv b{font-weight:600}
svg text{fill:var(--muted);font:11px var(--body)}
/* overlays */
.ov{position:fixed;inset:0;background:var(--sea);z-index:20;display:flex;flex-direction:column}
.ov header{flex:none}
.ovbody{flex:1;overflow:auto;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ovgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
#scatter{width:100%;height:340px;display:block;touch-action:none}
.prose{max-width:72ch}
.prose a{color:var(--ink);text-decoration-color:var(--accent);text-underline-offset:2px}
.prose p,.prose li{font-size:14px}
.rules td{white-space:normal;vertical-align:top}
input[type=search]{font:13px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-width:0}
@media (min-width:880px){
  .wrap{flex-direction:row}
  #sheet{flex:0 0 390px;max-height:none;border-top:0;border-left:1px solid var(--line)}
  .ovgrid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
}
@media (max-width:600px){ .legend .cue{display:none} h1{font-size:20px} .top{gap:6px 10px} }
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Civ <span>Italia</span></h1>
    <div class="row"><label for="elec" class="note" style="margin:0" data-i18n="Election">Election</label><select id="elec"></select></div>
    <div class="sp"></div>
    <div class="tools">
      <button class="btn" id="bExplorer" type="button" data-i18n="Explorer">Explorer</button>
      <button class="btn" id="bHelp" type="button" data-i18n="Rules & sources">Rules &amp; sources</button>
      <button class="btn" id="bLang" type="button" lang="it">Italiano</button>
      <button class="btn" id="bTheme" type="button" aria-label="Switch light or dark theme" data-i18n="Theme" data-i18n-aria="Switch light or dark theme">Theme</button>
    </div>
  </div>
  <div class="lenses" role="group" aria-label="Map lens" data-i18n-aria="Map lens" id="lenses"></div>
  <div class="legend" id="legend" aria-live="polite"></div>
</header>
<div class="wrap">
<main>
  <canvas id="map" aria-label="Hex map of Italy coloured by the selected lens. The same figures for every city are in the table in the side panel." data-i18n-aria="Hex map of Italy coloured by the selected lens. The same figures for every city are in the table in the side panel."></canvas>
  <div class="zoom"><button id="zin" aria-label="Zoom in" data-i18n-aria="Zoom in" type="button">+</button><button id="zout" aria-label="Zoom out" data-i18n-aria="Zoom out" type="button">−</button><button id="zfit" aria-label="Show all of Italy" data-i18n-aria="Show all of Italy" type="button">⌂</button></div>
  <div class="hint" id="hint" data-i18n="Tap a tile or a city">Tap a tile or a city</div>
</main>
<section id="sheet" aria-live="polite"><p class="note">Loading the map… / Caricamento della mappa…</p></section>
</div>

<div class="ov" id="explorer" hidden>
  <header><div class="top"><h1 data-i18n="Explorer">Explorer</h1><span class="note" style="margin:0" data-i18n="every comune, any two columns">every comune, any two columns</span><div class="sp"></div><button class="btn" id="xClose" type="button" data-i18n="Back to map">Back to map</button></div>
  <div class="row">
    <label for="xX" class="note" style="margin:0">X</label><select id="xX"></select>
    <label for="xY" class="note" style="margin:0">Y</label><select id="xY"></select>
    <label for="xR" class="note" style="margin:0" data-i18n="Region">Region</label><select id="xR"></select>
    <input type="search" id="xQ" placeholder="Find a comune" aria-label="Find a comune" data-i18n-ph="Find a comune" data-i18n-aria="Find a comune">
  </div></header>
  <div class="ovbody"><div class="ovgrid">
    <div class="card"><canvas id="scatter" aria-label="Scatter plot of the two chosen columns, one dot per comune" data-i18n-aria="Scatter plot of the two chosen columns, one dot per comune"></canvas><p class="note" id="xStat"></p></div>
    <div class="card"><div class="tscroll" style="max-height:60vh"><table class="tbl" id="xTable"></table></div><p class="note" id="xNote"></p></div>
  </div></div>
</div>

<div class="ov" id="help" hidden>
  <header><div class="top"><h1 data-i18n="Rules & sources">Rules &amp; sources</h1><div class="sp"></div><button class="btn" id="hClose" type="button" data-i18n="Back to map">Back to map</button></div></header>
  <div class="ovbody"><div class="prose" id="helpBody"></div></div>
</div>
<script src="app.js"></script>
</body>
</html>
