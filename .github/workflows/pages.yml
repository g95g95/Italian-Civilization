# Publishes the static app (web/) to the gh-pages branch, which GitHub Pages serves.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "Deploy from a branch",
# Branch: gh-pages, folder: / (root).
name: Publish to GitHub Pages

on:
  push:
    branches: [main, claude/happy-darwin-zzrjbx]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push web/ to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -r web "$RUNNER_TEMP/site"
          touch "$RUNNER_TEMP/site/.nojekyll"   # serve files as they are, no Jekyll build
          cd "$RUNNER_TEMP/site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898181+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish web/ from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
